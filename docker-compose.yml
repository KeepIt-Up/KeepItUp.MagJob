services:
  # Client application
  client:
    image: ${DOCKER_REGISTRY-}keepitup.magjob.client
    build:
      context: .
      dockerfile: src/KeepItUp.MagJob.Client/Dockerfile
    ports:
      - "80:80"

  # Gateway
  apigateway:
    image: ${DOCKER_REGISTRY-}keepitup.magjob.apigateway
    build:
      context: .
      dockerfile: src/KeepItUp.MagJob.APIGateway/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_HTTP_PORTS=80
      - ASPNETCORE_URLS=http://+:80

  # Microservices
  identity:
    image: ${DOCKER_REGISTRY-}keepitup.magjob.identity
    build:
      context: .
      dockerfile: src/KeepItUp.MagJob.Identity/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_HTTP_PORTS=80
      - ASPNETCORE_URLS=http://+:80
      - KeycloakAdmin__ClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - KeycloakAdmin__ServerUrl=http://keycloak:8080
      - ConnectionStrings__DefaultConnection=${MAGJOB_DB_CONNECTION}
    depends_on:
      magjob.database:
        condition: service_healthy      

  # calendar:
  #   image: ${DOCKER_REGISTRY-}keepitup.magjob.calendar
  #   build:
  #     context: .
  #     dockerfile: src/KeepItUp.MagJob.Calendar/Dockerfile
  #   ports:
  #     - "5006:80"
  #   environment:
  #   depends_on:
  #     - magjob.database
  #     - keycloak

  # timeEvidence:
  #   image: ${DOCKER_REGISTRY-}keepitup.magjob.timeEvidence
  #   build:
  #     context: .
  #     dockerfile: src/KeepItUp.MagJob.TimeEvidence/Dockerfile
  #   ports:
  #     - "5008:80"
  #   environment:
  #   depends_on:
  #     - magjob.database
  #     - keycloak

  # Chat API
  chat:
    image: ${DOCKER_REGISTRY-}keepitup.magjob.chat
    build:
      context: .
      dockerfile: src/KeepItUp.MagJob.Chat/Dockerfile
    ports:
      - "5003:80"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://magjob.database:5432/magjob
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://host.docker.internal:18080/realms/keepitup-magjob
      - SERVER_URL=http://host.docker.internal:18080
      - PORT=80
      - REALM=keepitup-magjob
    depends_on:
      - magjob.database
      - keycloak

  # Keycloak (Identity Server)
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    ports:
      - "18080:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=keycloak.database
      - KC_DB_USERNAME=${KEYCLOAK_DB_USERNAME}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./src/Keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./src/Keycloak/themes/magjob:/opt/keycloak/themes/magjob
    depends_on:
      keycloak.database:
        condition: service_healthy

  # Databases
  keycloak.database:
    image: postgres:17.2
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - ${APPDATA}/KeepItUp.MagJob/db/keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  magjob.database:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${MAGJOB_DB_USERNAME}
      POSTGRES_PASSWORD: ${MAGJOB_DB_PASSWORD}
      POSTGRES_DB: ${MAGJOB_DB_NAME}
    volumes:
      - ${APPDATA}/KeepItUp.MagJob/db/magjob:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAGJOB_DB_USERNAME} -d ${MAGJOB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  workevidence:
    image: ${DOCKER_REGISTRY-}workevidence.api
    build:
      context: .
      dockerfile: src/KeepItUp.MagJob.WorkEvidence/Dockerfile
    ports:
      - "5010:80"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://magjob.database:5432/magjob
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://host.docker.internal:18080/realms/keepitup-magjob
      - SERVER_URL=http://host.docker.internal:18080/
      - PORT=80
      - REALM=magjob-realm
    depends_on:
      - magjob.database
      - keycloak

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAGJOB_DB_USERNAME} -d ${MAGJOB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  calendar:
    image: ${DOCKER_REGISTRY-}keepitup.magjob.calendar
    build:
      context: .
      dockerfile: src/KeepItUp.MagJob.Calendar/Dockerfile
    ports:
      - "5007:80"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://magjob.database:5432/magjob
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://host.docker.internal:18080/realms/keepitup-magjob
      - SERVER_URL=http://host.docker.internal:18080/
      - PORT=80
      - REALM=keepitup-magjob
    depends_on:
      - magjob.database
      - keycloak
