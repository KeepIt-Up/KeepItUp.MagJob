<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto">
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-gray-600 bg-opacity-50 transition-opacity"
    (click)="onClose()"
    (keydown.enter)="onClose()"
    (keydown.space)="onClose()"
    tabindex="0"
    role="button"
    aria-label="Zamknij modal"
  ></div>

  <!-- Modal -->
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
      <!-- Header -->
      <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900">Add chat members</h3>
        <button (click)="onClose()" class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Form -->
      <form [formGroup]="addMembersForm" (ngSubmit)="onSubmit()" class="p-6">
        <!-- Member Selection -->
        <div class="mb-6">
          <span class="block text-sm font-medium text-gray-700 mb-2">Select members</span>

          <!-- Loading State -->
          <div *ngIf="loading" class="flex justify-center py-4">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
          </div>

          <!-- Empty State -->
          <div *ngIf="!loading && members.length === 0" class="text-center py-8 text-gray-500">
            <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
              ></path>
            </svg>
            <p class="text-sm">All organization member are already in this chat</p>
          </div>

          <!-- Member List -->
          <div *ngIf="!loading && members.length > 0" class="max-h-48 overflow-y-auto border border-gray-300 rounded-lg">
            <div
              *ngFor="let member of members"
              (click)="onMemberToggle(member)"
              (keydown.enter)="onMemberToggle(member)"
              (keydown.space)="onMemberToggle(member)"
              tabindex="0"
              role="button"
              class="flex items-center p-3 cursor-pointer hover:bg-gray-50 border-b border-gray-100 last:border-b-0 focus:outline-none focus:ring-2 focus:ring-blue-500"
              [class.bg-blue-50]="isMemberSelected(member)"
            >
              <div
                class="flex-shrink-0 w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center"
              >
                <span class="text-sm font-medium text-gray-700">
                  {{ member.firstName.charAt(0) }}{{ member.lastName.charAt(0) }}
                </span>
              </div>

              <div class="ml-3 flex-1">
                <p class="text-sm font-medium text-gray-900">
                  {{ member.firstName }} {{ member.lastName }}
                </p>
              </div>

              <!-- Selection Indicator -->
              <div class="flex-shrink-0">
                <div
                  class="w-5 h-5 rounded-full border-2 transition-colors"
                  [class.bg-blue-600]="isMemberSelected(member)"
                  [class.border-blue-600]="isMemberSelected(member)"
                  [class.border-gray-300]="!isMemberSelected(member)"
                >
                  <svg
                    *ngIf="isMemberSelected(member)"
                    class="w-full h-full text-white"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <div *ngIf="memberIdsError" class="mt-1 text-sm text-red-600">
            {{ memberIdsError }}
          </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end space-x-3">
          <button
            type="button"
            (click)="onClose()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          >
            Cancel
          </button>

          <button
            type="submit"
            [disabled]="!addMembersForm.valid || submitting || members.length === 0"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="!submitting">Add chat members</span>
            <span *ngIf="submitting" class="flex items-center">
              <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
              Adding chat members...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
