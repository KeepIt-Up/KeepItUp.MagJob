<div class="h-full">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center h-32">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
  </div>

  <!-- Empty State -->
  <div
    *ngIf="!loading && chats.length === 0"
    class="flex flex-col items-center justify-center h-32 text-gray-500"
  >
    <svg class="w-12 h-12 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
      ></path>
    </svg>
    <p class="text-sm">No chats yet</p>
    <p class="text-xs">Create your first chat to start messaging</p>
  </div>

  <!-- Chat List -->
  <div *ngIf="!loading && chats.length > 0" class="space-y-1 p-2">
    <div
      *ngFor="let chat of chats"
      (click)="onChatSelect(chat)"
      class="flex items-center p-3 rounded-lg cursor-pointer transition-colors duration-150 hover:bg-gray-100"
      [class.bg-blue-50]="selectedChat?.id === chat.id"
      [class.border-l-4]="selectedChat?.id === chat.id"
      [class.border-blue-500]="selectedChat?.id === chat.id"
    >
      <!-- Chat Avatar -->
      <div
        class="flex-shrink-0 w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-semibold text-sm"
      >
        {{ chat.title.charAt(0).toUpperCase() }}
      </div>

      <!-- Chat Info -->
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <p class="text-sm font-medium text-gray-900 truncate">
            {{ chat.title }}
          </p>
          <span class="text-xs text-gray-500">
            {{ formatDate(chat.dateOfCreation) }}
          </span>
        </div>

        <div class="flex items-center justify-between mt-1">
          <p class="text-xs text-gray-500 truncate">
            {{ getLastMessagePreview(chat) }}
          </p>
          <span class="text-xs text-gray-400"> {{ getChatMembersCount(chat) }} members </span>
        </div>
      </div>
    </div>
  </div>
</div>
