<div class="calendar-container">
  <div class="calendar-header">
    <div class="controls">
      <div class="navigation-buttons">
        <button
          class="btn-nav"
          mwlCalendarPreviousView
          [view]="view"
          [(viewDate)]="viewDate"
        >
          <span class="flex items-center gap-2">
            <i class="bi bi-chevron-left"></i>
            <span>Previous</span>
          </span>
        </button>
        <button
          class="btn-nav"
          mwlCalendarToday
          [(viewDate)]="viewDate"
        >
          <span class="flex items-center gap-2">
            <i class="bi bi-calendar-event"></i>
            <span>Today</span>
          </span>
        </button>
        <button
          class="btn-nav"
          mwlCalendarNextView
          [view]="view"
          [(viewDate)]="viewDate"
        >
          <span class="flex items-center gap-2">
            <i class="bi bi-chevron-right"></i>
            <span>Next</span>
          </span>
        </button>
        <button
          class="btn-nav bg-blue-500 hover:bg-blue-600 text-white"
          (click)="addEvent()"
        >
          <span class="flex items-center gap-2">
            <i class="bi bi-plus-lg"></i>
            <span>Add Event</span>
          </span>
        </button>
      </div>
      <h3 class="current-date">{{ viewDate | date:'MMMM yyyy' }}</h3>
      <div class="view-buttons">
        <button
          class="btn-view"
          (click)="setView(CalendarView.Month)"
          [class.active]="view === CalendarView.Month"
        >
          Month
        </button>
        <button
          class="btn-view"
          (click)="setView(CalendarView.Week)"
          [class.active]="view === CalendarView.Week"
        >
          Week
        </button>
        <button
          class="btn-view"
          (click)="setView(CalendarView.Day)"
          [class.active]="view === CalendarView.Day"
        >
          Day
        </button>
      </div>
    </div>
  </div>

  <div [ngSwitch]="view">
    <mwl-calendar-month-view
      *ngSwitchCase="CalendarView.Month"
      [viewDate]="viewDate"
      [events]="events"
      [refresh]="refresh"
      [eventActions]="actions"
      (eventClicked)="handleEvent('Clicked', $event.event)"
    >
    </mwl-calendar-month-view>
    <mwl-calendar-week-view
      *ngSwitchCase="CalendarView.Week"
      [viewDate]="viewDate"
      [events]="events"
      [refresh]="refresh"
      [eventActions]="actions"
      (eventClicked)="handleEvent('Clicked', $event.event)"
    >
    </mwl-calendar-week-view>
    <mwl-calendar-day-view
      *ngSwitchCase="CalendarView.Day"
      [viewDate]="viewDate"
      [events]="events"
      [refresh]="refresh"
      [eventActions]="actions"
      (eventClicked)="handleEvent('Clicked', $event.event)"
    >
    </mwl-calendar-day-view>
  </div>
</div>

<div *ngIf="showDeleteConfirm" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
    <h3 class="text-lg font-medium mb-4 text-gray-900 dark:text-white">Delete Event</h3>
    <p class="text-gray-600 dark:text-gray-300 mb-4">
      Are you sure you want to delete "{{ eventToDelete?.title }}"?
    </p>
    <div class="flex justify-end gap-4">
      <button
        class="btn-nav"
        (click)="cancelDelete()"
      >
        Cancel
      </button>
      <button
        class="btn-nav bg-red-500 hover:bg-red-600 text-white"
        (click)="confirmDelete()"
      >
        Delete
      </button>
    </div>
  </div>
</div>

<div *ngIf="showEditDialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
    <h3 class="text-lg font-medium mb-4 text-gray-900 dark:text-white">Edit Event</h3>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Title</label>
        <input
          type="text"
          [(ngModel)]="editedEvent!.title"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
        >
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Start Date</label>
        <input
          type="datetime-local"
          [(ngModel)]="editedEvent!.start"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
        >
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">End Date</label>
        <input
          type="datetime-local"
          [(ngModel)]="editedEvent!.end"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
        >
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
        <textarea
          [(ngModel)]="editedEvent!.description"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
          rows="3"
        ></textarea>
      </div>
    </div>
    <div class="flex justify-end gap-4 mt-6">
      <button
        class="btn-nav"
        (click)="cancelEdit()"
      >
        Cancel
      </button>
      <button
        class="btn-nav bg-blue-500 hover:bg-blue-600 text-white"
        (click)="confirmEdit()"
      >
        Save
      </button>
    </div>
  </div>
</div>

        (click)="confirmAdd()"

        Add Event
      </button>
    </div>
  </div>
</div>
