<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
    <h3 class="text-lg font-medium mb-4 text-gray-900 dark:text-white">Delete Event</h3>
    <p class="text-gray-600 dark:text-gray-300 mb-6">
      Are you sure you want to delete this event?
    </p>
    <div class="flex justify-end gap-2">
      <button
        class="btn-nav bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white"
        (click)="onCancel()"
      >
        Cancel
      </button>
      <button class="btn-nav bg-red-500 hover:bg-red-600 text-white" (click)="onConfirm()">
        Delete
      </button>
    </div>
  </div>
</div>
