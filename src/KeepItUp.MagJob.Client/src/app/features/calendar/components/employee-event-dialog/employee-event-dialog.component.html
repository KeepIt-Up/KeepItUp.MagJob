<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
    <h3 class="text-lg font-medium mb-4 text-gray-900 dark:text-white">Manage Time Entry</h3>

    <div class="mb-4 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
      <h4 class="font-medium text-gray-900 dark:text-white mb-2">{{ event.title }}</h4>
      <p class="text-sm text-gray-600 dark:text-gray-300 mb-1">
        <strong>Start Date:</strong> {{ event.start | date: 'dd.MM.yyyy HH:mm' }}
      </p>
      <p class="text-sm text-gray-600 dark:text-gray-300">
        <strong>End Date:</strong> {{ event.end | date: 'dd.MM.yyyy HH:mm' }}
      </p>
    </div>

    <div class="mb-6">
      <label
        for="statusSelect"
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
      >
        Time Entry Status
      </label>
      <select
        id="statusSelect"
        [(ngModel)]="selectedStatus"
        name="statusSelect"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option *ngFor="let status of getStatusOptions()" [value]="status">
          {{ getStatusLabel(status) }}
        </option>
      </select>
    </div>

    <div class="flex justify-end gap-2">
      <button
        class="btn-nav bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white"
        (click)="onCancel()"
      >
        Cancel
      </button>
      <button
        class="btn-save"
        [class.btn-save-disabled]="!hasStatusChanged()"
        [disabled]="!hasStatusChanged()"
        (click)="onStatusChange()"
      >
        Save Changes
      </button>
    </div>
  </div>
</div>
