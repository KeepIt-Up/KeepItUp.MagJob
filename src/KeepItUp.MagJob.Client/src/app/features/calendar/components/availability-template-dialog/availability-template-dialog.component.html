<div class="modal-backdrop">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Create Availability Template</h2>
      <button type="button" class="close-button" (click)="onCancel()">×</button>
    </div>
    <div class="modal-body">
      <form [formGroup]="templateForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Template Name</label>
          <input type="text" id="name" formControlName="name" class="form-control">
          <div *ngIf="templateForm.get('name')?.invalid && templateForm.get('name')?.touched" class="error-message">
            Name is required
          </div>
        </div>

        <div class="form-group">
          <label for="organizationId">Organization ID</label>
          <input type="text" id="organizationId" formControlName="organizationId" class="form-control">
          <div *ngIf="templateForm.get('organizationId')?.invalid && templateForm.get('organizationId')?.touched" class="error-message">
            Organization ID is required
          </div>
        </div>

        <div class="form-group">
          <label for="startDayOfWeek">Start Day of Week</label>
          <select id="startDayOfWeek" formControlName="startDayOfWeek" class="form-control">
            <option *ngFor="let day of dayOfWeekOptions" [value]="day">{{ day }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="numberOfDays">Number of Days</label>
          <input type="number" id="numberOfDays" formControlName="numberOfDays" class="form-control" min="1" max="14">
          <div *ngIf="templateForm.get('numberOfDays')?.invalid && templateForm.get('numberOfDays')?.touched" class="error-message">
            Number of days must be between 1 and 14
          </div>
        </div>

        <h3>Time Entries</h3>
        <div formArrayName="timeEntryTemplates">
          <div *ngFor="let entry of timeEntryTemplates.controls; let i = index" class="time-entry-container" [formGroupName]="i">
            <div class="time-entry-header">
              <h4>Time Entry #{{ i + 1 }}</h4>
              <button type="button" class="remove-button" (click)="removeTimeEntry(i)" *ngIf="timeEntryTemplates.length > 1">Remove</button>
            </div>
            
            <div class="form-group">
              <label [for]="'startTime' + i">Start Time (HH:MM:SS)</label>
              <input type="text" [id]="'startTime' + i" formControlName="startTime" class="form-control" placeholder="08:00:00">
            </div>
            
            <div class="form-group">
              <label [for]="'endTime' + i">End Time (HH:MM:SS)</label>
              <input type="text" [id]="'endTime' + i" formControlName="endTime" class="form-control" placeholder="17:00:00">
            </div>
            
            <div class="form-group">
              <label [for]="'startDayOffset' + i">Start Day Offset</label>
              <input type="number" [id]="'startDayOffset' + i" formControlName="startDayOffset" class="form-control">
            </div>
            
            <div class="form-group">
              <label [for]="'endDayOffset' + i">End Day Offset</label>
              <input type="number" [id]="'endDayOffset' + i" formControlName="endDayOffset" class="form-control">
            </div>
          </div>
          
          <button type="button" class="add-entry-button" (click)="addTimeEntry()">Add Time Entry</button>
        </div>

        <div class="modal-footer">
          <button type="button" class="cancel-button" (click)="onCancel()">Cancel</button>
          <button type="submit" class="save-button" [disabled]="templateForm.invalid">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
