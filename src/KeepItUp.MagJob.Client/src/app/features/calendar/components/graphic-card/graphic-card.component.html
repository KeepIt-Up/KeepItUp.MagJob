<div
  class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 hover:shadow-md transition-shadow duration-200"
>
  <div class="flex items-start justify-between mb-4">
    <h3 class="text-lg font-semibold text-gray-900">{{ graphic.name }}</h3>
    <app-tag [text]="getDateRange()"></app-tag>
  </div>

  <div class="space-y-3">
    <div class="flex items-center justify-between text-sm">
      <span class="text-gray-600">Time Entries:</span>
      <span class="font-medium text-gray-900">{{ getTotalTimeEntries() }}</span>
    </div>

    <div class="flex items-center justify-between text-sm">
      <span class="text-gray-600">Total Hours:</span>
      <span class="font-medium text-gray-900">{{ getTotalHours().toFixed(1) }}h</span>
    </div>

    <div class="flex items-center justify-between text-sm">
      <span class="text-gray-600">Assigned Members:</span>
      <span class="font-medium text-gray-900">{{ getTotalMembers() }}</span>
    </div>

    <div class="flex items-center justify-between text-sm">
      <span class="text-gray-600">Unique Members:</span>
      <span class="font-medium text-gray-900">{{ getUniqueMembersCount() }}</span>
    </div>
  </div>

  <div class="mt-6 pt-4 border-t border-gray-100 flex space-x-2">
    <app-button
      variant="primary"
      size="sm"
      [routerLink]="['/user/graphics', graphic.id]"
      class="flex-1"
    >
      View Details
    </app-button>
    <app-button
      size="sm"
      [routerLink]="['/user/graphics', graphic.id, 'manage-members']"
      class="flex-1"
    >
      Manage Members
    </app-button>
  </div>
</div>
