<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-md">
  <div
    *ngFor="let notification of notifications"
    class="notification flex p-4 rounded-lg cursor-pointer transform transition-all duration-300 hover:scale-105 shadow-lg"
    [ngClass]="{
      'bg-green-500 text-white': notification.type === 'success',
      'bg-red-500 text-white': notification.type === 'error',
      'bg-blue-500 text-white': notification.type === 'info',
      'bg-yellow-500 text-white': notification.type === 'warning',
    }"
    (click)="handleNotificationClick(notification)"
    (keydown.enter)="handleNotificationClick(notification)"
    tabindex="0"
    role="alert"
  >
    {{ notification.message }}
  </div>
</div>
