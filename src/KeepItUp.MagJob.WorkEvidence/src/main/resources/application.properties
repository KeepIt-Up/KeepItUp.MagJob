spring.application.name=WorkEvidence.API


spring.datasource.url=jdbc:postgresql://localhost:5433/magjob
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.task.scheduling.enabled=true

#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always

#management.endpoints.web.exposure.include=prometheus, health

keepitup.magjob.backend.url=http://localhost:5010
server.port=${PORT:5010}


spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:18080/realms/keepitup-magjob}

realm=master
server-url=http://localhost:18080
client-id=admin-cli
grant-type=password
name=admin
password=admin

#logging.file.name=logs/logs.log
logging.level.org.springframework.web=INFO
page.number=0
page.size=10
