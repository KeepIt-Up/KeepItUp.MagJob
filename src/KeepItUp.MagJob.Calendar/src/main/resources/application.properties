spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/magjob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.application.name=KeepItUp.MagJob.Calendar
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=calendar
spring.jpa.properties.javax.persistence.create-database-schemas=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.hbm2ddl.auto=create
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

keepitup.magjob.backend.url=http://localhost:5002/
server.port=${PORT:5003}
gateway.url=${GATEWAY_URL:http://apigateway:80}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:18080/realms/keepitup-magjob%7D}
logging.file.name=logs/logs.log
page.number=0
page.size=10

google.credentials.file-path=file:src/main/resources/credentials.json
google.calendar.id=your-calendar-id@group.calendar.google.com


spring.security.oauth2.client.registration.google.client-id=${google.client.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client.client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=${google.client.redirect-uris}
spring.security.oauth2.client.registration.google.scope=email,profile,https://www.googleapis.com/auth/calendar